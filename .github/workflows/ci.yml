name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  safety-checks:
    name: Safety checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Brisbane/SEQ import preview validation
        run: npm run import:brisbane-seq

      - name: Human-reviewed records validation
        run: npm run validate:review-records
